<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf8">
		<meta name="description" content="Inventario SAT">
		<meta name="keywords" content="HTML5, CSS3, JavaScript">
		<title>INVENTARIO</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}"/>
	</head>
	<body style="background-color:powderblue;">
		<header>
		</header>
			{% include 'navbar.html' %}
		<section>
			<article>
			<br>
            <div class="busquedaform">
                <div class="textobusqueda">
                    <h1>Filtro por pais:</h1>
                    <form method="POST" action="/llamadasALL" id="llamadasALL">
                        <label for="paises">PAIS:</label>
                        <select id="paises" name="paises">
                            <option value="*">TODOS</option>
                            {% for LLAMADAS in resultadoConsultaPais %}
                            <option value="{{ LLAMADAS.pais }}"> {{ LLAMADAS.pais }}</option>
                            {% endfor %}
                        </select>
                        <label for="cliente">CLIENTE:</label>
                        <input type="text" id="cliente" name="cliente">
                        <label for="fecha_abandono">FECHA ABANDONO:</label>
                        <input type="date" id="fecha_abandono" name="fecha_abandono">
                        <label for="hora_abandono">HORA ABANDONO:</label>
                        <input type="time" id="hora_abandono" name="hora_abandono" step="1">
                        <label for="agente">Agente:</label>
                        <select id="agente" name="agente">
                            <option value="*">TODOS</option>
                            {% for LLAMADAS in resultadoConsultaAgente %}
                            <option value="{{ LLAMADAS.agente }}"> {{ LLAMADAS.agente }}</option>
                            {% endfor %}
                        </select>
                        <br>
                        <br>
                        <input type="submit" value="BUSCAR" class="boton-buscar">
                    </form>
                </div>
            </div>
		</article>
		</section>
		<footer class="pieDePagina">
		<h3 style="text-align:center">Copyright © 2026 All rights reserved.</h3>
		</footer>
	</body>
</html>
